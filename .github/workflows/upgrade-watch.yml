name: Upgrade watch

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, then a newer Pixeltable when PyPI has one
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pin="$(python scripts/pixeltable_pin.py)"
          latest="$(python - <<'PY'
          import json
          import urllib.request

          url = 'https://pypi.org/pypi/pixeltable/json'
          with urllib.request.urlopen(url, timeout=30) as resp:
              print(json.load(resp)['info']['version'])
          PY
          )"
          echo "pin=${pin} latest=${latest}"
          if [ "$latest" != "$pin" ]; then
            pip install --upgrade "pixeltable==${latest}"
          fi
          python -c 'import pixeltable as pxt; print("installed", pxt.__version__)'
      - name: Pytest
        run: pytest -q
      - name: Isolated schema apply
        run: python scripts/schema_apply_smoke.py
      - name: Local media graph
        run: python -m video_benchmark.local_demo
      - name: Ask for a pin bump when a newer release is green
        run: |
          pin="$(python scripts/pixeltable_pin.py)"
          installed="$(python -c 'import pixeltable as pxt; print(pxt.__version__)')"
          echo "pin=${pin} installed=${installed}"
          if [ "$installed" = "$pin" ]; then
            echo "Installed Pixeltable matches the pyproject.toml pin."
            exit 0
          fi
          echo "Newer Pixeltable ${installed} passed tests. Bump pyproject.toml to pixeltable==${installed}."
          exit 1
