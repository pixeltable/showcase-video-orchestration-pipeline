[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-benchmark"
version = "0.2.0"
description = "Pixeltable SDK showcase: media transforms, provider calls, and reusable video evidence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Base install runs Paths 1, 1L, and 2 (Gemini).
dependencies = [
    "pixeltable==0.7.16",
    "google-genai>=2.0",
    "numpy>=2.0",
    "pillow>=10.1",
    "scenedetect>=0.6",
]

[project.optional-dependencies]
# Path 3: local ASR. Also install llama-cpp-python for the local VLM and synthesis model
# (its build flags are platform-specific, so it is not pinned here).
oss = ["torch>=2.0", "openai-whisper>=20231117", "whisperx>=3.1", "huggingface_hub>=0.23"]
fal = ["fal-client>=0.5"]
bedrock = ["boto3>=1.34"]
videomme = ["datasets>=2.19", "yt-dlp>=2024.8"]
paper = ["matplotlib>=3.8"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0"]
dev = ["ruff>=0.4", "pytest>=8.0"]

[project.scripts]
run-benchmark = "video_benchmark.cli:main"
run-videomme = "video_benchmark.videomme.cli:main"
run-media-demo = "video_benchmark.local_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
